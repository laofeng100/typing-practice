version: '3.8'

services:
  typing-practice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: typing-practice
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - DATABASE_URL=file:/app/db/custom.db
      - SESSION_SECRET=${SESSION_SECRET:-}
      - TTS_SERVER_URL=${TTS_SERVER_URL:-}
      - TTS_TOKEN=${TTS_TOKEN:-}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # SQLite数据库持久化
      - ./db:/app/db
      # Excel数据源（首次初始化用）
      - ./upload:/app/upload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # HTTPS 反向代理（可选）：`docker compose --profile https up -d` 启用
  # 前提：域名已解析到本机，80/443 端口可用；证书由 Caddy 自动申请与续期
  caddy:
    image: caddy:2-alpine
    container_name: typing-caddy
    profiles: ["https"]
    depends_on:
      - typing-practice
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
